<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>好饭 · 效果预览（纯色色块 UI）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background:#20242b; min-height:100vh; display:flex; gap:40px;
    align-items:flex-start; justify-content:center; padding:36px 24px; color:#e8e4dd;
  }
  /* ---------- 左侧面板 ---------- */
  #panel { width:340px; padding-top:8px; }
  #panel h1 { font-size:20px; margin-bottom:6px; }
  #panel .sub { font-size:13px; color:#9aa0ab; margin-bottom:22px; line-height:1.7; }
  .grp { margin-bottom:18px; }
  .grp .lbl { font-size:12px; color:#9aa0ab; margin-bottom:8px; letter-spacing:1px; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; }
  .btns button {
    padding:8px 14px; border:none; border-radius:10px; cursor:pointer;
    background:#2e333c; color:#cfd4dc; font-size:13px; transition:all .15s;
  }
  .btns button:hover { background:#3a404b; }
  .btns button.on { background:#f08c1e; color:#fff; font-weight:600; }
  #stats { margin-top:24px; background:#262b33; border-radius:14px; padding:16px; font-size:12.5px; line-height:2; color:#a8aeba; }
  #stats b { color:#e8e4dd; }
  #stats .w { color:#e8b46a; }
  /* ---------- 手机壳 ---------- */
  .phone {
    width:390px; height:812px; background:#111; border-radius:54px; padding:12px;
    box-shadow:0 30px 80px rgba(0,0,0,.55); flex-shrink:0;
  }
  .screen {
    width:100%; height:100%; background:#fff8ef; border-radius:44px; overflow:hidden;
    display:flex; flex-direction:column; color:#3d332b;
  }
  .statusbar { height:44px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:#3d332b; flex-shrink:0; }
  .content { flex:1; overflow-y:auto; padding:8px 16px 16px; scrollbar-width:none; }
  .content::-webkit-scrollbar { display:none; }
  /* ---------- 页头 ---------- */
  .pg-head { display:flex; align-items:baseline; justify-content:space-between; padding:10px 4px 14px; }
  .pg-head .t { font-size:26px; font-weight:800; letter-spacing:1px; }
  .pg-head .r { font-size:12px; color:#9a8f80; }
  /* ---------- 概览卡 ---------- */
  .hero {
    background:#fff; border-radius:22px; padding:18px 18px 16px; margin-bottom:14px;
    box-shadow:0 4px 16px rgba(122,96,66,.06); display:flex; align-items:center; gap:14px;
  }
  .hero .big { font-size:44px; font-weight:800; color:#b26a00; line-height:1; }
  .hero .big small { font-size:13px; font-weight:600; color:#9a8f80; margin-left:4px; }
  .hero .meta { font-size:13px; color:#7a6a55; margin-top:6px; }
  .hero .title { font-size:15px; font-weight:700; margin-bottom:6px; }
  .hero .chips { display:flex; gap:6px; margin-left:auto; flex-direction:column; align-items:flex-end; }
  .chip { font-size:11px; background:#faf5ea; color:#854f0b; border-radius:999px; padding:3px 10px; }
  /* ---------- 周导航（新） ---------- */
  .wnav {
    display:flex; background:#fff; border-radius:18px; padding:7px 6px; margin-bottom:14px;
    box-shadow:0 4px 16px rgba(122,96,66,.06);
  }
  .wnav .it {
    flex:1; display:flex; flex-direction:column; align-items:center; padding:7px 0 6px;
    border-radius:12px; cursor:pointer; transition:background .2s;
  }
  .wnav .it .wd { font-size:13px; font-weight:600; color:#7a6a55; }
  .wnav .it .dt { font-size:11px; color:#9a8f80; margin-top:2px; }
  .wnav .it.on { background:#b26a00; box-shadow:0 4px 12px rgba(178,106,0,.3); }
  .wnav .it.on .wd, .wnav .it.on .dt { color:#fff; }
  .wnav .it.tdy .wd { color:#b26a00; }
  /* ---------- 日卡 ---------- */
  .dc { background:#fff; border-radius:20px; padding:16px; margin-bottom:14px; box-shadow:0 4px 16px rgba(122,96,66,.06); }
  .dc.today { background:#fff7ea; box-shadow:0 6px 20px rgba(178,106,0,.14); }
  .dc.tomorrow { background:#fcf9f1; }
  .dc .head { display:flex; align-items:center; margin-bottom:12px; }
  .dc .head .date { font-size:15px; font-weight:700; }
  .badge { margin-left:8px; font-size:11px; padding:2px 10px; border-radius:999px; }
  .badge.today { background:#b26a00; color:#fff; }
  .badge.tomorrow { background:#f3e5c8; color:#854f0b; }
  .dc .more { margin-left:auto; font-size:12px; color:#9a8f80; }
  .meal { display:flex; align-items:center; border-radius:14px; padding:10px 12px; margin-bottom:8px; }
  .meal:last-of-type { margin-bottom:0; }
  .meal .mlabel { writing-mode:vertical-rl; text-orientation:upright; letter-spacing:3px; font-size:13px; font-weight:700; margin-right:10px; opacity:.85; flex-shrink:0; }
  .thumb {
    width:52px; height:52px; border-radius:12px; flex-shrink:0; margin-right:12px;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    background:rgba(255,255,255,.75);
  }
  .meal .main { flex:1; min-width:0; }
  .meal .dish { font-size:15px; font-weight:700; }
  .meal .opts { font-size:12px; opacity:.85; margin-top:2px; }
  .meal .miss { opacity:.45; font-weight:400; }
  .prep { margin-top:12px; background:rgba(255,255,255,.6); border-radius:12px; padding:10px 12px; }
  .prep .pi { display:flex; margin-bottom:6px; font-size:12px; }
  .prep .pi:last-child { margin-bottom:0; }
  .prep .tag { flex-shrink:0; width:20px; height:20px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; margin-right:8px; }
  .prep .tag.m { background:#faeeda; color:#854f0b; }
  .prep .tag.e { background:#e6f1fb; color:#0c447c; }
  .prep .tag.u { background:#f3eee5; color:#7a6a55; }
  .prep .pl { color:#7a6a55; font-weight:600; }
  .prep .ps { color:#9a8f80; }
  .sec { font-size:13px; color:#9a8f80; margin:6px 4px 10px; }
  .sec.link { color:#b26a00; cursor:pointer; }
  /* ---------- 空态 ---------- */
  .empty { text-align:center; padding:60px 30px; }
  .empty .em { font-size:44px; margin-bottom:12px; }
  .empty .tt { font-size:17px; font-weight:700; margin-bottom:8px; }
  .empty .ds { font-size:13px; color:#9a8f80; line-height:1.7; }
  .empty .btn { margin-top:18px; display:inline-block; background:#b26a00; color:#fff; border-radius:999px; padding:10px 30px; font-size:14px; }
  /* ---------- tabBar ---------- */
  .tabbar {
    flex-shrink:0; height:64px; background:#fff; display:flex; align-items:stretch;
    border-radius:0 0 44px 44px; box-shadow:0 -2px 12px rgba(122,96,66,.05);
  }
  .tabbar .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; }
  .tabbar .tab img { width:24px; height:24px; }
  .tabbar .tab span { font-size:10px; color:#9a8f80; }
  .tabbar .tab.on span { color:#b26a00; font-weight:700; }
</style>

  { key:'mid',    label:'周中 9/22（进行中）', date:'2026-09-22' },
  { key:'end',    label:'期末 9/26（最后一天）', date:'2026-09-26' },
];
const VIEWS = [ ['today','今日'], ['week','一周'], ['mine','我的'] ];
const cur = { view:'today', tkey:'mid' };

function todayISO(){ return TODAY_OPTS.find(o=>o.key===cur.tkey).date; }
function diffDays(a,b){ return Math.round((new Date(a)-new Date(b))/86400000); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtMD(iso){ const d=new Date(iso+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate(); }
function wdShort(d){ return (d.weekdayText||'').slice(-1); }

function stateOf(t){
  if (t < PERIOD.startDate) return 'before';
  if (t > PERIOD.endDate) return 'after';
  return 'in-period';
}

/* ---------- 组件渲染 ---------- */
function mealBlock(m){
  const st = MEAL_STYLE[m.meal] || { bg:'#f3eee5', fg:'#7a6a55', label:'餐次' };
  const title = m.missing ? '<span class="dish miss">未安排</span>' : '<div class="dish">'+esc(m.displayTitle)+'</div>';
  const opts = (m.options && m.options.length>1) ? '<div class="opts">可选：'+m.options.map(esc).join(' 或 ')+'</div>' : '';
  return '<div class="meal" style="background:'+st.bg+';color:'+st.fg+'">'
    + '<span class="mlabel">'+st.label+'</span>'
    + '<div class="thumb">🍽️</div>'
    + '<div class="main">'+title+opts+'</div></div>';
}
function prepBlock(day){
  const list = day.prepNotes || [];
  if (!list.length) return '';
  const items = list.map(p=>{
    const t = p.timing==='morning'?'m':p.timing==='evening'?'e':'u';
    const tt = p.timing==='morning'?'早':p.timing==='evening'?'晚':'·';
    return '<div class="pi"><span class="tag '+t+'">'+tt+'</span><div><span class="pl">'+esc(p.label||'')+'</span>'
      + (p.stepsText?' <span class="ps">'+esc(p.stepsText)+'</span>':'')+'</div></div>';
  }).join('');
  return '<div class="prep">'+items+'</div>';
}
function dayCard(day, hl, compact){
  const meals = (day.meals||[]).map(mealBlock).join('');
  return '<div class="dc '+(hl||'')+'">'
    + '<div class="head"><span class="date">'+fmtMD(day.date)+' '+esc(day.weekdayText)+'</span>'
    + (hl==='today'?'<span class="badge today">今天</span>':'')
    + (hl==='tomorrow'?'<span class="badge tomorrow">明天</span>':'')
    + '</div>' + meals + prepBlock(day) + '</div>';
}
function weekNav(t){
  const inPeriod = t >= PERIOD.startDate && t <= PERIOD.endDate;
  const sel = inPeriod ? t : PERIOD.startDate;
  return '<div class="wnav">' + DAYS.map(d=>{
    const cls = d.date===sel ? 'it on' : (d.date===t ? 'it tdy' : 'it');
    return '<div class="'+cls+'"><span class="wd">'+wdShort(d)+'</span><span class="dt">'+fmtMD(d.date)+'</span></div>';
  }).join('') + '</div>';
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ---------- 视图 ---------- */
function renderToday(){
  const t = todayISO(), st = stateOf(t);
  if (st==='before'){
    const d = diffDays(PERIOD.startDate, t);
    return '<div class="pg-head"><span class="t">好饭</span></div>'
      + '<div class="empty"><div class="em">🍚</div><div class="tt">食谱已就绪，还没开饭</div>'
      + '<div class="ds">距离开饭还有 '+d+' 天（'+fmtMD(PERIOD.startDate)+' - '+fmtMD(PERIOD.endDate)+'）</div>'
      + '<span class="btn">先看看这期菜单</span></div>';
  }
  if (st==='after'){
    return '<div class="pg-head"><span class="t">好饭</span></div>'
      + '<div class="empty"><div class="em">📭</div><div class="tt">这一期吃完了</div>'
      + '<div class="ds">上一份食谱已结束，把新一周的 Excel 导进来吧</div>'
      + '<span class="btn">导入新食谱</span></div>';
  }
  const todayDay = DAYS.find(d=>d.date===t);
  const tomorrowDay = DAYS.find(d=>d.date===addDays(t,1));
  const dayN = diffDays(t, PERIOD.startDate)+1;
  let h = '<div class="pg-head"><span class="t">好饭</span><span class="r">本期 '+fmtMD(PERIOD.startDate)+' - '+fmtMD(PERIOD.endDate)+' ›</span></div>';
  h += '<div class="hero"><div><div class="title">本期第 <span style="color:#b26a00">'+dayN+'</span> 天</div>'
     + '<div class="meta">'+esc(PERIOD.startWeekdayText)+'打头 · 家人共用</div></div>'
     + '<div class="chips"><span class="chip">'+DATA.stats.mealCells+' 道菜</span><span class="chip">'+DATA.stats.prepNotes+' 条备料</span></div></div>';
  h += weekNav(t);
  h += '<div class="sec">今天的饭</div>';
  h += todayDay ? dayCard(todayDay,'today',false) : '<div class="dc"><div class="ds">今天没有安排</div></div>';
  h += '<div class="sec link">明天吃什么 ›</div>';
  h += tomorrowDay ? dayCard(tomorrowDay,'tomorrow',false) : '<div class="dc"><span style="font-size:13px;color:#9a8f80">明天的安排还没导入</span></div>';
  return h;
}
function renderWeek(){
  const t = todayISO();
  const inPeriod = t>=PERIOD.startDate && t<=PERIOD.endDate;
  let h = '<div class="pg-head"><span class="t">本期菜单</span><span class="r">'+fmtMD(PERIOD.startDate)+' - '+fmtMD(PERIOD.endDate)+'</span></div>';
  h += weekNav(t);
  if (!inPeriod) h += '<div class="sec">今天不在本期里，已为你定位到第一天</div>';
  h += DAYS.map(d=>{
    const hl = d.date===t ? 'today' : d.date===addDays(t,1) ? 'tomorrow' : '';
    return dayCard(d, hl, true);
  }).join('');
  return h;
}
function renderMine(){
  return '<div class="pg-head"><span class="t">我的</span></div>'
    + '<div class="dc"><div class="head"><span class="date">数据统计</span></div>'
    + '<div class="meta" style="font-size:13px;color:#7a6a55;line-height:2">已导入 '+DAYS.length+' 天食谱 · '+DATA.stats.mealCells+' 道菜 · '+DATA.stats.prepNotes+' 条备料<br>历史周期自动归档</div></div>'
    + '<div class="dc"><div class="head"><span class="date">历史周期</span></div>'
    + '<div style="background:#faf5ea;border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;font-size:13px"><span>'+fmtMD(PERIOD.startDate)+' - '+fmtMD(PERIOD.endDate)+'</span><span style="color:#c9bda9">›</span></div>'
    + '<div style="font-size:12px;color:#9a8f80">旧的周期会出现在这里</div></div>';
}

function render(){
  const c = document.getElementById('content');
  c.innerHTML = cur.view==='today' ? renderToday() : cur.view==='week' ? renderWeek() : renderMine();
  c.scrollTop = 0;
  document.getElementById('stats').innerHTML =
    '解析引擎统计<br>周期 <b>'+PERIOD.startDate+'</b> ~ <b>'+PERIOD.endDate+'</b>（'+PERIOD.startWeekdayText+'打头）<br>'
    + '菜格 <b>'+DATA.stats.mealCells+'</b> · 备料 <b>'+DATA.stats.prepNotes+'</b> · 合并单元格已填充<br>'
    + '告警 <span class="w">'+(DATA.warnings||[]).map(w=>w.code).join(' / ')+'</span>';
  syncBtns();
}
function syncBtns(){
  document.querySelectorAll('#vb button').forEach(b=>b.classList.toggle('on', b.dataset.v===cur.view));
  document.querySelectorAll('#db button').forEach(b=>b.classList.toggle('on', b.dataset.d===cur.tkey));
  const tb = document.getElementById('tabbar');
  tb.innerHTML = VIEWS.map(v=>{
    const base = v[0]==='mine'?'mine':v[0];
    const ic = cur.view===v[0] ? (ICONS[base+'-active']||'') : (ICONS[base]||'');
    return '<div class="tab '+(cur.view===v[0]?'on':'')+'" data-v="'+v[0]+'">'
      + (ic?'<img src="'+ic+'">':'<div style="width:24px;height:24px"></div>')
      + '<span>'+v[1]+'</span></div>';
  }).join('');
  tb.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{ cur.view=el.dataset.v; render(); });
}
function init(){
  document.getElementById('vb').innerHTML = VIEWS.map(v=>'<button data-v="'+v[0]+'">'+v[1]+'</button>').join('');
  document.querySelectorAll('#vb button').forEach(b=>b.onclick=()=>{ cur.view=b.dataset.v; render(); });
  document.getElementById('db').innerHTML = TODAY_OPTS.map(o=>'<button data-d="'+o.key+'">'+o.label+'</button>').join('');
  document.querySelectorAll('#db button').forEach(b=>b.onclick=()=>{ cur.tkey=b.dataset.d; render(); });
  // hash 直达：#week / #end / #week&d=end
  const h = location.hash.slice(1);
  if (h) {
    h.split('&').forEach(kv=>{
      const [k,v] = kv.split('=');
      if (k==='d' && TODAY_OPTS.some(o=>o.key===v)) cur.tkey = v;
      if (!k && VIEWS.some(x=>x[0]===h)) cur.view = h;
      if (k==='v' && VIEWS.some(x=>x[0]===v)) cur.view = v;
    });
    if (VIEWS.some(x=>x[0]===h)) cur.view = h;
  }
  render();
}
init();
</script>
</body>
</html>
